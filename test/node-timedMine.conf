txLoad {
    enabled = true

    # Desired block gas limit. Set together with forcegaslimit=true
    # Or rely on root-level targetgaslimit
    blockTargetGas = 17000000

    # Primary transaction gas to attempt per block (e.g., 9M)
    primaryTxGas = 17000000

    # Profile: intrinsic | cpu | writes | reads | mixed
    profile = "writes"

    # Optional deterministic seed for sender account
    senderSeed = "txload_default_seed"
}
rpc {
    gasEstimationCap = 17000000
    providers {
        web {
            http {
                hosts = ["localhost", "127.0.0.1", "::1", "rskj-miner1", "rskj-miner2", "rskj-miner3", "rskj-miner4", "rskj-node1", "rskj-node2", "host.docker.internal"]
            }
        }
    }
}

