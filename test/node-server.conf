

sync {
    # Maximum amount of bodies to request at the same time when synchronizing backwards
    maxRequestedBodies = 2000

    # Amount of blocks contained in a chunk,
    # MUST BE 192 or a divisor of 192
    chunkSize = 1920

    snapshot {
        enabled = false
        chunkSize = 100
        chunkRequestTimeout = 120
        compression = false
        limit = 1000000
    }
}

scoring = {
    punishmentEnabled = false
}
